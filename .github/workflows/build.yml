name: Build Fabric Mod 1.21.4

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-organize project structure
        run: |
          mkdir -p src/main/java/com/example/witheraura
          mkdir -p src/main/resources
          find . -maxdepth 2 -name "WitherAuraClient.java" -exec cp {} src/main/java/com/example/witheraura/WitherAuraClient.java \;
          find . -maxdepth 2 -name "fabric.mod.json" -exec cp {} src/main/resources/fabric.mod.json \;
          ls -la src/main/java/com/example/witheraura/
          ls -la src/main/resources/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Mod JAR
        run: |
          gradle build --no-daemon
          jar tf build/libs/wither-aura-1.21.4-2.0.0.jar | grep "WitherAuraClient.class"

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wither-aura-1.21.4-jar
          path: |
            build/libs/wither-aura-1.21.4-2.0.0.jar
            
